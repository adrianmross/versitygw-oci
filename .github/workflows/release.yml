name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF#refs/tags/}"
          if [ "${GITHUB_REF}" = "${ref}" ]; then ref="edge"; fi
          echo "tags=ghcr.io/${GITHUB_REPOSITORY_OWNER}/versitygw-oci:${ref}" >> "$GITHUB_OUTPUT"

      # The Dockerfile runs go vet and go test before building, so a broken
      # plugin fails here rather than at plugin-load time in a cluster.
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
