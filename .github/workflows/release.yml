name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0)"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || (github.event_name != 'workflow_dispatch' && github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve and validate tag
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"

          if [ -z "$tag" ]; then
            echo "Release tag could not be determined." >&2
            exit 1
          fi

          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid tag format: $tag" >&2
            echo "Expected semantic version tag like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch --tags --force
            if ! git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              echo "Tag $tag does not exist." >&2
              exit 1
            fi
            git checkout "$tag"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile runs go vet and go test before building, so a broken
      # plugin fails here rather than at plugin-load time in a cluster.
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/versitygw-oci:${{ env.RELEASE_TAG }}

      # The image is the artifact, so there are no binaries to attach — but the
      # release is what makes a version discoverable, and pinning the digest lets
      # consumers verify what they pulled instead of trusting a mutable tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/versitygw-oci:${RELEASE_TAG}"

          {
            echo "## Image"
            echo
            echo '```'
            echo "${image}"
            echo "digest: ${DIGEST}"
            echo '```'
            echo
            echo "Bundles versitygw and the OCI backend plugin, built from one module."
            echo "Pull by digest to be certain what you are running — a tag can be moved."
          } > notes.md

          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
